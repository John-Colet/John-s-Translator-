<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Translation Display</title>
<link rel="stylesheet" href="display.css" />
</head>
<body>
  <main id="stage">
    <p id="text" class="state-idle">Waiting for a translation&hellip;</p>
  </main>

  <div id="controls">
    <button id="theme-toggle" class="ctrl-btn" title="Cycle light / dark / chroma-key background">
      <svg id="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
        <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <svg id="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
        <path d="M21 12.5A9 9 0 1 1 11.5 3 7 7 0 0 0 21 12.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <svg id="icon-chroma" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
        <rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="2"/>
        <path d="M4 15l5-5 4 4 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div id="chroma-color-group" class="ctrl-group">
      <input id="chroma-color-picker" type="color" value="#00ff00" title="Chroma-key color (for keying out in OBS / PowerPoint / etc.)" />
    </div>

    <div class="ctrl-group">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="ctrl-icon">
        <path d="M4 12h2M8 7v10M12 4v16M16 8v8M20 12h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="font-slider" class="ctrl-slider" type="range" min="24" max="180" step="2" value="64" />
    </div>

    <div class="ctrl-sep"></div>

    <button id="rolling-toggle" class="ctrl-btn" title="Auto-clear older text so only the latest words stay on screen">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M18 3v4h-4M6 21v-4h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="ctrl-group">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="ctrl-icon">
        <path d="M4 6h16M4 12h10M4 18h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="words-slider" class="ctrl-slider" type="range" min="10" max="150" step="5" value="40" title="How many recent words to keep on screen" />
    </div>

    <div class="ctrl-sep"></div>

    <button id="source-clear-toggle" class="ctrl-btn" title="Auto-clear the Google Translate source box once it gets long, so it never hits Google's 5000-character limit">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="7" width="18" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        <path d="M9 10l6 4M15 10l-6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="ctrl-group">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="ctrl-icon">
        <path d="M4 18a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M12 18l4-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="chars-slider" class="ctrl-slider" type="range" min="500" max="4800" step="100" value="4000" title="Clear Google's source box once it reaches this many characters" />
    </div>

    <button id="clear-source-btn" class="ctrl-btn" title="Clear Google's source text box right now">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="ctrl-sep"></div>

    <button id="fullscreen-toggle" class="ctrl-btn" title="Fill the screen (drag this window to your second monitor first)">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <a id="credit" href="https://john.colet.ca" target="_blank" rel="noopener noreferrer">© John Colet · john.colet.ca</a>

  <script src="display.js"></script>
</body>
</html>
